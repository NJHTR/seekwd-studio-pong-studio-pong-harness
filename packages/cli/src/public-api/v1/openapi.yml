# Paths and components are generated from @PublicApiController routes. See openapi-gen/generate.ts.
paths: {}
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-PONG-API-KEY
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    CookieAuth:
      type: apiKey
      in: cookie
      # Must match AUTH_COOKIE_NAME in packages/cli/src/constants.ts
      name: pong-auth

security:
  - ApiKeyAuth: []
  - BearerAuth: []
  - CookieAuth: []
