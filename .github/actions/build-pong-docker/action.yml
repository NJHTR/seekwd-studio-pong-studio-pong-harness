# Builds the pong and runners CI test images (pongio/pong:local +
# pongio/runners:local) and caches the tarball under a SHA-derived key so
# downstream jobs in the same workflow run can restore it via
# load-pong-docker.
#
# Cache-aware: if the tarball for this SHA is already cached (e.g. a parent
# workflow ran prepare-docker earlier), the build step is skipped and this
# action becomes a no-op.

name: 'Build pong CI Docker image'
description: 'Builds pongio/pong + pongio/runners test images and publishes them as a SHA-keyed cache tarball for downstream shards.'

inputs:
  build-variant:
    description: 'standard, coverage, or pc. Coverage uses build:docker:coverage. pc builds pong on the pointer-compressed Node base images.'
    required: false
    default: 'standard'

runs:
  using: 'composite'
  steps:
    - name: Check cache for existing image
      id: cache-check
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: pong-docker-image-v2-${{ inputs.build-variant }}-${{ github.sha }}
        path: /tmp/pong-images
        lookup-only: true

    - name: Build Docker image
      if: steps.cache-check.outputs.cache-hit != 'true'
      uses: ./.github/actions/setup-nodejs
      with:
        build-command: ${{ inputs.build-variant == 'coverage' && 'pnpm build:docker:coverage' || 'pnpm build:docker' }}
        enable-docker-cache: true
        docker-cache-key: pong-io/pong
      env:
        INCLUDE_TEST_CONTROLLER: 'true'
        DOCKER_BUILD_TARBALL_DIR: /tmp/pong-images
        DOCKER_BUILD_PC: ${{ inputs.build-variant == 'pc' }}

    - name: Assert pointer compression
      if: steps.cache-check.outputs.cache-hit != 'true' && inputs.build-variant == 'pc'
      shell: bash
      run: |
        docker load -i /tmp/pong-images/pong-pc.tar
        docker run --rm --entrypoint node pongio/pong:local -e "
          if (!process.config.variables.v8_enable_pointer_compression) {
            throw new Error('pc variant image is not pointer-compressed');
          }
          console.log(process.version, 'pointer compression: on');
        "

    - name: Check native bindings
      if: steps.cache-check.outputs.cache-hit != 'true' && inputs.build-variant == 'pc'
      shell: bash
      run: |
        docker run --rm --entrypoint node \
          -v "$GITHUB_WORKSPACE/.github/scripts/docker/kafka-native-smoke-check.mjs:/tmp/kafka-check.mjs:ro" \
          pongio/pong:local /tmp/kafka-check.mjs
        docker run --rm --entrypoint node \
          -v "$GITHUB_WORKSPACE/.github/scripts/docker/edit-image-native-smoke-check.mjs:/tmp/edit-image-check.mjs:ro" \
          pongio/pong:local /tmp/edit-image-check.mjs

    - name: Report tarball sizes
      if: steps.cache-check.outputs.cache-hit != 'true'
      shell: bash
      run: ls -lh /tmp/pong-images

    - name: Publish image tarball to cache
      if: steps.cache-check.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: pong-docker-image-v2-${{ inputs.build-variant }}-${{ github.sha }}
        path: /tmp/pong-images
